# Standalone builds, attached to a release on tag.
#
# The npx route is the one that always works and needs no CI at all; this exists
# so somebody without Node can double-click something instead. Both are offered
# in the README, in that order, on purpose.
#
# @julusian/midi is a native addon, so each binary has to be built on its own
# platform - there is no cross-compiling this. That is why the matrix is runners
# rather than target triples.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: node20-win-x64
            asset: music-theory-midi-bridge-win-x64.exe
          - os: macos-13
            target: node20-macos-x64
            asset: music-theory-midi-bridge-macos-x64
          - os: macos-latest
            target: node20-macos-arm64
            asset: music-theory-midi-bridge-macos-arm64
          - os: ubuntu-latest
            target: node20-linux-x64
            asset: music-theory-midi-bridge-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # The native .node has to be carried in beside the executable: pkg
      # bundles JavaScript, and a native addon is not that.
      - name: Package
        shell: bash
        run: |
          npx @yao-pkg/pkg dist/index.js \
            --targets ${{ matrix.target }} \
            --output ${{ matrix.asset }}
          mkdir -p out
          mv ${{ matrix.asset }} out/
          cp -r node_modules/@julusian/midi/build/Release/*.node out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            ```
            npx music-theory-midi-bridge
            ```

            Or download the build for your machine below.

            **Windows** also needs [loopMIDI](https://www.tobias-erichsen.de/software/loopmidi.html)
            and four ports created by hand — the bridge prints the exact names
            on startup. macOS and Linux need nothing else.
