# Standalone builds, attached to a release on tag.
#
# These are the ONLY way to get this program today. The README used to lead with
# `npx music-theory-midi-bridge` as the route that always works, and it never
# worked: the package has never been published, so the registry returns a 404
# and everybody who took the short path got an error. Until `npm publish` is
# run, this workflow's output is the whole distribution.
#
# @julusian/midi is a native addon, so each binary has to be built on its own
# platform - there is no cross-compiling this. That is why the matrix is runners
# rather than target triples.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: node20-win-x64
            asset: music-theory-midi-bridge-win-x64.exe
          # No Intel Mac build. GitHub retired the macos-13 image, which was
          # the last x64 runner, and a native addon cannot be cross-compiled
          # from Apple Silicon - so the job simply queued forever and took the
          # whole release with it. Intel Macs use npx, which the README leads
          # with anyway.
          - os: macos-latest
            target: node20-macos-arm64
            asset: music-theory-midi-bridge-macos-arm64
          - os: ubuntu-latest
            target: node20-linux-x64
            asset: music-theory-midi-bridge-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # `pkg .` and not `pkg dist/index.js`, which is the difference between a
      # working download and a broken one: given an entry FILE, pkg ignores the
      # `pkg.assets` glob in package.json, so the native MIDI binding never
      # entered the snapshot and every binary could do everything except open a
      # port. Given the package, it reads the config and carries the .node in.
      - name: Package
        shell: bash
        run: |
          npx @yao-pkg/pkg . \
            --targets ${{ matrix.target }} \
            --output ${{ matrix.asset }}
          mkdir -p out
          mv ${{ matrix.asset }} out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/

  release:
    needs: build
    # Not `success()`: a single platform failing or losing its runner should
    # still publish the builds that worked. A release with three binaries beats
    # a release with none while somebody investigates the fourth.
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            Download the build for your machine below and run it. (There is no
            `npx` line here on purpose: this package has never been published
            to npm, and the registry 404s for it.)

            **Windows** also needs [loopMIDI](https://www.tobias-erichsen.de/software/loopmidi.html)
            and four ports created by hand — the bridge prints the exact names
            on startup. macOS and Linux need nothing else.

            Scan the QR code it prints with the phone. It opens a pairing page
            with the address filled in; one tap connects, and it names any
            loopMIDI port it could not find.
